name: Cognitive Atlas checks
on:
  pull_request:
    paths:
      - 'tools/cognitive-atlas/**'
      - '.github/workflows/cognitive-atlas.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and test GGUF byte restoration
        run: |
          python -m py_compile tools/cognitive-atlas/atlas.py
          python tools/cognitive-atlas/atlas.py selftest
      - name: Validate probe corpus
        run: |
          python - <<'PY'
          import csv, collections
          with open('tools/cognitive-atlas/probes.tsv') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))
          assert len(rows) == 40
          counts = collections.Counter((r['category'],r['split']) for r in rows)
          assert len(counts)==20 and set(counts.values())=={2}
          assert all(r['correct'] != r['wrong'] for r in rows)
          PY
