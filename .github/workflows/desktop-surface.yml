name: Desktop Surface checks
on:
  pull_request:
    paths:
      - 'native/desktop-surface/**'
      - 'src/Wds.Roots.Experience/**'
      - 'src/Wds.Roots.Host/Tree/**'
      - 'tests/Roots.HostChecks/**'
      - 'src/Wds.Roots.Tree/**'
      - 'native/tree-core/**'
      - 'chrome-extension/roots-translate/**'
      - 'scripts/Build-DesktopSurface.ps1'
      - 'build-surface.cmd'
      - 'launch-surface.cmd'
      - '.github/workflows/desktop-surface.yml'
  workflow_dispatch:
jobs:
  native-tree-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Compile and test native chronological and weight APIs
        run: |
          cmake -S native/tree-core -B build/tree-check -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tree-check --parallel
          ctest --test-dir build/tree-check --output-on-failure
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build native Surface including OCR
        run: |
          cmake -S native/desktop-surface -B build/desktop-surface -G "Visual Studio 17 2022" -A x64 -DROOTS_SURFACE_OCR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/desktop-surface --config Release --parallel
      - name: Test OCR region masking and tile coverage
        run: ctest --test-dir build/desktop-surface -C Release --output-on-failure
      - name: Build managed private Tree receiver
        run: dotnet build src/Wds.Roots.Experience -c Release
      - name: Build host with local Experience view
        run: dotnet build src/Wds.Roots.Host -c Release
      - name: Run host and archive regression checks
        run: dotnet run --project tests/Roots.HostChecks -c Release
      - name: Validate extension JavaScript
        run: |
          node --check chrome-extension/roots-translate/tree.js
          node --check chrome-extension/roots-translate/background.js
          node --check chrome-extension/roots-translate/experience-dom.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model-free streaming protocol tests
        working-directory: native/desktop-surface/audio
        run: python -m unittest -v test_inworld_worker.py
