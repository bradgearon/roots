[package]
name = "roots-whirlwind"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "roots_whirlwind"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "roots-whirlwind"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iroh = "=1.5.0"
libp2p = { version = "=0.57.1", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "relay", "dcutr", "identify", "kad", "macros", "ed25519"] }
libp2p-stream = "=0.5.0-alpha"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
hex = "0.4"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
